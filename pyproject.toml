[project]
name = "softcloak"
version = "1.1.1"
description = "Replace strings in an APK and re-sign it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [
  { name = "Afflatoria" }
]
license = "MIT"
[project.urls]
Homepage = "https://github.com/Afflatoria/SoftCloak"

[project.optional-dependencies]
dev = ["ruff>=0.16"]

[project.scripts]
softcloak = "softcloak.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["softcloak*"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.egg-info"]
